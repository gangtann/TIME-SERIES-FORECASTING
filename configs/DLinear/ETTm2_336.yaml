# DLinear / ETTm2 / 96 -> 336（官方配方: scripts/EXP-LongForecasting/Linear/ettm2.sh）
# 官方协议 seq_len=336，此处按本框架 seq96 统一协议，仅沿用官方其余超参
basic:
  model: DLinear
  model_id: DLinear_ETTm2_96_336

data:
  data: ETTm2
  data_path: ETTm2.csv
  pred_len: 336

training:
  batch_size: 32
  learning_rate: 0.01
  # train_epochs 不再覆盖（官方 10）：学习率计划与轮数无关，上限取 default 的 100、靠早停自然收敛
