# DLinear / ETTh2 / 96 -> 96（官方配方: scripts/EXP-LongForecasting/Linear/etth2.sh）
# 官方协议 seq_len=336，此处按本框架 seq96 统一协议，仅沿用官方其余超参
basic:
  model: DLinear
  model_id: DLinear_ETTh2_96_96

data:
  data: ETTh2
  data_path: ETTh2.csv
  pred_len: 96

training:
  batch_size: 32
  learning_rate: 0.05
  train_epochs: 10          # 官方 run_longExp.py argparse 默认（patience/lradj/loss 同 default）
