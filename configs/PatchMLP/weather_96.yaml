# PatchMLP / weather / 96 -> 96（模型与训练配方: DUET 仓库第三方配方
# scripts/multivariate_forecast/Weather_script/PatchMLP.sh 的 horizon=96 条目，其 seq_len=336，
# 此处按本框架 seq96 协议；配方中 norm=true 即 default 的 use_norm；其余未列键=官方 run.py 默认）
basic:
  model: PatchMLP
  model_id: PatchMLP_weather_96_96

data:
  data: custom
  data_path: weather.csv
  pred_len: 96
  enc_in: 21
  dec_in: 21
  c_out: 21

model:
  d_model: 1024             # DUET 配方
  e_layers: 1               # DUET 配方

training:
  batch_size: 64            # DUET 配方
  learning_rate: 0.0001     # DUET 配方
  # train_epochs 不再覆盖（官方 20）：学习率计划与轮数无关，上限取 default 的 100、靠早停自然收敛
  patience: 5               # 官方 run.py 默认
