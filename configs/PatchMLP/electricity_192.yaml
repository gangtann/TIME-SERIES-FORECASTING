# PatchMLP / electricity / 96 -> 192（模型与训练配方: DUET 仓库 decisionintelligence/DUET 第三方配方
# scripts/multivariate_forecast/Electricity_script/PatchMLP.sh 的 horizon=192 条目，其 seq_len=336，
# 此处按本框架 seq96 协议；配方中 norm=true 即 default 的 use_norm；
# 配方 dropout=0.1 与模型硬编码 nn.Dropout(0.1) 一致不写；其余未列键=官方 run.py 默认）
# 显存提示：electricity 321 通道，batch 64 保持 DUET 配方；[64,321,1024] fp32 单张量约 84 MB，
# e_layers=2 × 两路编码器，估算峰值约 3 GB 级，24 GB 余量充足；未设 micro_batch
basic:
  model: PatchMLP
  model_id: PatchMLP_electricity_96_192

data:
  data: custom
  data_path: electricity.csv
  pred_len: 192
  enc_in: 321
  dec_in: 321
  c_out: 321

model:
  d_model: 1024             # DUET 配方
  e_layers: 2               # DUET 配方

training:
  batch_size: 64            # DUET 配方
  learning_rate: 0.0001     # DUET 配方
  # train_epochs 不再覆盖（官方 20）：学习率计划与轮数无关，上限取 default 的 100、靠早停自然收敛
  patience: 5               # 官方 run.py 默认
