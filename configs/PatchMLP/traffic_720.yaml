# PatchMLP / traffic / 96 -> 720（模型与训练配方: DUET 仓库 decisionintelligence/DUET 第三方配方
# scripts/multivariate_forecast/Traffic_script/PatchMLP.sh 的 horizon=720 条目，其 seq_len=512，
# 此处按本框架 seq96 协议；配方中 norm=true 即 default 的 use_norm；
# 配方 dropout=0.1 与模型硬编码 nn.Dropout(0.1) 一致不写；其余未列键=官方 run.py 默认）
# 显存提示：traffic 862 通道，batch 64 保持 DUET 配方；[64,862,1024] fp32 单张量约 226 MB，
# e_layers=1 × 季节/趋势两路编码器，估算峰值约 6 GB 级，24 GB 预计可装下但为全表最重格；未设 micro_batch
basic:
  model: PatchMLP
  model_id: PatchMLP_traffic_96_720

data:
  data: custom
  data_path: traffic.csv
  pred_len: 720
  enc_in: 862
  dec_in: 862
  c_out: 862

model:
  d_model: 1024             # DUET 配方
  e_layers: 1               # DUET 配方

training:
  batch_size: 64            # DUET 配方
  learning_rate: 0.001      # DUET 配方
  # train_epochs 不再覆盖（官方 20）：学习率计划与轮数无关，上限取 default 的 100、靠早停自然收敛
  patience: 5               # 官方 run.py 默认
