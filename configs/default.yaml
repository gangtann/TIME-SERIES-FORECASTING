# 全局默认配置。实验配置（configs/<Model>/*.yaml）按节深合并覆盖这里的值；
# 命令行可用 --set key=value 覆盖单项（支持 'training.learning_rate=1e-3' 或裸 'pred_len=192'）。
# 合并后所有叶子键被扁平化为单层命名空间，代码里以 configs.d_model 方式访问，
# 因此不同节之间的键名不允许重复。

basic:
  task_name: long_term_forecast
  model: PatchTST          # models/__init__.py 的 MODEL_REGISTRY 键名
  model_id: test           # 实验标识，进入 checkpoint/结果目录名
  seed: 2021
  deterministic: false     # true = 严格复现模式（cudnn.deterministic，稍慢）
  is_training: 1           # 0 = 只加载 checkpoint 测试
  des: exp                 # 实验描述后缀
  itr: 1                   # 重复次数

data:
  data: ETTh1              # data_provider/data_factory.py 的 data_dict 键名
  root_path: ./dataset/
  data_path: ETTh1.csv
  features: M              # M: 多变量预测多变量; S: 单变量; MS: 多变量预测单变量
  target: OT               # features 为 S/MS 时的目标列
  freq: h                  # 时间特征频率: s/t/h/d/b/w/m
  embed: timeF             # timeF: time_features 编码; 其他: 整数日历特征
  seq_len: 96              # 输入窗口长度
  label_len: 48            # decoder 起始 token 长度（PatchTST 不使用）
  pred_len: 96             # 预测长度
  enc_in: 7                # 输入变量数
  dec_in: 7
  c_out: 7
  num_workers: 4
  inverse: false           # 测试时是否反标准化后再算指标

model:
  d_model: 512
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 2048
  factor: 1
  dropout: 0.1
  head_dropout: 0.1        # 预测头独立 dropout（官方 PatchTST 头部为 0，encoder 为 0.2/0.3）
  activation: gelu
  patch_len: 16
  stride: 8
  use_norm: true           # 模型内置归一化开关（iTransformer/SimpleTM 等 baseline 读取；PatchTST/PRISM 不读）

training:
  train_epochs: 100        # 轮数上限不作为约束（2026-09-10 用户规定：每个模型靠早停自然收敛）；
                           #   官方脚本按 epoch 数定义学习率计划的模型（TST/cosine 类）在各自 yaml 保留官方轮数
  batch_size: 32
  patience: 3
  learning_rate: 0.0001
  loss: MSE                # 训练损失：MSE/MAE/huber/smooth_l1/arctan_mae(xPatch)；验证与早停恒用 MSE
  lradj: type1             # type1/type2/type3/cosine/constant/TST(OneCycleLR)/sigmoid(xPatch)/cosine2(TimeFilter)
  pct_start: 0.3           # 仅 lradj=TST 时生效
  use_amp: false
  micro_batch: 0           # 0 = 关。>0 时每个 batch 拆成 ≤ micro_batch 条的块做前向/反传，梯度累积后每 batch 更新一次；
                           # batch 组成、步数、学习率计划与整批 batch_size 完全一致，验证/测试也分块前向。只为装进显存，
                           # 不改配方（PRISM 在 traffic/electricity 上 batch 256 装不下跨通道 token 混合）
  rec_lambda: 1.0          # 时域 MSE 权重（仅 auxi_lambda>0 时参与加权）
  auxi_lambda: 0.0         # FreDF 频域辅助损失权重；0 = 完全关闭（走原始损失路径）
  auxi_type: complex       # 频域损失形式（当前实现: complex 差的模）

prism:                     # PRISM 专用超参（其他模型不读取本节）；键名沿用 FRAME 原版 argparse
  patch_pool: [0, 8, 12, 16, 24, 28, 32, 40, 48]  # 候选 patch 长度偏移，实际长度 = min_patch_len + 偏移
                           # （原版 argparse 默认 [0,2,3,5]，但全部 seq96 脚本用本行这套）
  min_patch_len: 8         # 最短 patch，同时决定 max_patch_len = min_patch_len + max(pool)（原版 --min_patch_len 8）
  pattern_nums: 5          # K：谱模式原型数 = MoE 专家数（原版默认 5，各 yaml 逐数据集覆盖）
  pattern_strategy: 1      # 消融①原型参数化: 0 混合 | 1 共享随机 | 2 逐通道随机 | 3 数据驱动共享 | 4 数据驱动逐通道（原版全脚本 1）
  freq_topk: 3             # 谱相似度保留的 top-k 频点（原版默认 3；须 ≤ max_patch_len//2+1）
  p_model: 64              # patch 内部特征维 D_p，须被 n_heads 整除（原版默认 64）
  seasonal_alpha: 0.9      # 消融②谱/趋势分支混合: 1.0 = 纯谱分支，0.0 = 纯趋势分支（原版默认 0.9）
  moving_avg: 25           # SpectralMoE 内 series_decomp 滑窗（原版默认 25；沿 patch 轴平滑，见 layers 文件头）
  gumbel_tau: 0.5          # patch 长度硬选择温度（原版硬编码 0.5；仅训练期，推理恒走 argmax）
  patch_select: st         # st(默认，无噪声直通估计，前向确定) | gumbel(原版，每步重采样分块，
                           #   实测 run 间相对标准差 2.7~5.1%，大于多数待测效应，结论不可用)
  sra_sigma: 0.3           # 稀疏谱高斯平滑带宽（原版 PDP 调用处硬编码 0.3；0 关闭平滑）
  # ---- 消融开关（原版无，本框架新增；默认值 = 原版完整模型）----
  sra_sparse: true         # 消融③频域匹配: false = 跳过 top-k 稀疏化与高斯平滑，直接算原始谱余弦
  use_hgnn: false          # 消融④关系建模(原始位置)：图作用在专家滤波器 self.weights 上。
                           #   默认 false —— w 与 pattern_emb(strategy 0~2) 均为自由参数，图输出仍是
                           #   自由参数，可达滤波器集合不变，纯重参数化，消融效应必为零（六次实测确认）。
                           #   真正的关系建模走 token_mix（图作用在数据上）。true 保留作对照挡
  hgnn_ctx: static         # static(原版：图节点上下文是 pattern_emb，而 pattern_strategy=1 下它是纯自由参数，
                           #   故 HGNN 只是重参数化、use_hgnn 消融必为零) | spectral(注入逐样本跨通道谱画像，
                           #   投影零初始化故初值与 static 等价；本模型唯一的真跨通道通路)
  use_moe_gate: true       # 消融⑤混合专家: false = 门控退化为均匀 1/K（K 个专家等权平均）
  # ---- 结构改动（原版无）----
  tokenize: direct         # direct(默认，token 展平后是预测头唯一输入) | recon(原版，patch 散射回 [B,C,L]，
                           #   与输入同形状同量级，预测头可完全绕开主干——实测旁路对照四格差异 ≤0.4%，
                           #   残差门自学到仅 0.06，主干贡献不可区分于零)
  patch_mode: uniform      # greedy(原版，游标扫描，段数随 batch 变化，无法配 tokenize=direct)
                           # | uniform(等分 N 段) | fixed_random(构造期抽定一组非等分段长，此后恒定；
                           #   与 uniform 只差"段长不等"、与 greedy_fixed 只差"边界不随输入变"，用于
                           #   拆分这两项的影响) | greedy_fixed(谱共振定边界 + 恰好 N 段，
                           #   候选长度过精确可达性表；与 uniform 构成 Adaptive 主张的 A/B 对照)
                           # | greedy_v2(自适应 v2：候选段面积重采样到 adp_resample_len 后打分、可训练路由
                           #   MLP 由预测损失经直通估计选段、恰好 N 段；配 adp_regrid 重栅格化。需 tokenize=direct、
                           #   boundary_scope=sample、patch_norm=resample；等分是其 ℓ≡T0 的特例。见 layers 文件头)
                           # | oracle(oracle-EM：构造期枚举全部合法划分（≤512 种），训练时 E 步逐划分前向、用真实预测损失
                           #   为每条样本选划分，M 步在该划分上训练并用交叉熵训练路由器，推理走路由器 argmax；暖启动期恒等分。
                           #   固定最优 ⇒ E 步恒选等分 ⇒ 数值等于固定 patch。需 tokenize=direct、patch_norm=resample，
                           #   且等分长度须在池内。测试末尾打印 oracle 上界与路由器一致率。见 layers 文件头)
  patch_norm: pad          # pad(原版：段零填充到 max_patch_len 再 rFFT，短段谱被矩形窗泄漏主导，相似度成了长度的
                           #   函数) | resample(段面积重采样到 adp_resample_len；fixed_random 挡可用，用于把"段长不等"
                           #   的代价与零填充/槽位失配拆开；greedy_v2 强制 resample)。uniform 挡两者恒等
  adp_resample_len: 16     # T0：重采样后的段长（= 等分段长时 uniform 与重采样管线逐位同形）
  adp_router_hidden: 32    # greedy_v2 路由器 MLP 隐层宽度（输入 K 个共振分数 + log(ℓ/T0)，输出 1 个 logit）
  adp_lambda: 0.01         # greedy_v2 选段分布熵正则系数（0 关闭）：log P − H(p̄)，p̄ 为整批决策的平均软选择分布
  oracle_warmup: 5         # oracle 挡暖启动轮数：前几轮恒用等分划分，模型从固定 patch 的解出发
  oracle_ce: 1.0           # oracle 挡路由器交叉熵权重（模仿 E 步标签）
  oracle_chunk: 8          # oracle 挡 E 步每次并行评估的划分数（复制 batch，显存换时间）
  oracle_margin: 0.0       # oracle 挡 E 步离开等分的门槛：argmin 损失 < 等分损失×(1−margin) 才选非等分（滤 31 选 1 的选择噪声）
  oracle_train_on: router  # oracle 挡 M 步用的划分：router(路由器 argmax，训练即测试用法；路由器恒等分时与固定 patch 逐位相同)
                           #   | oracle(E 步标签；首轮实测因训练/测试划分分布不一致比固定差 1.3%)
  adp_regrid: true         # 非等分挡把 N 个 token 按时间重叠投影回 N 个等分槽位（可微无参数），展平头的槽位语义
                           #   不再随边界漂移。注意：④/④b 消融行（greedy_fixed/fixed_random）的历史数字在此键
                           #   之前测得，run_ablation.sh 已为这两行显式关闭
  gate_scope: token        # channel(原版：逐样本/逐段分数被 mean 掉，门控恒为 [C,K]，等价于每通道一个
                           #   自由滤波器，故门控与其消融效应必为零) | token(保留 [B,P,K]，路由真正随输入变化)
  token_mix: hgnn          # hgnn(默认，把 HeteroGraphAttention
                           #   移到 token 序列上，节点=(通道,patch 位置)，两步注意力=同通道跨时间/同时刻跨通道；
                           #   零初始化门，初值与 none 等价。需 tokenize=direct)
                           # | none(原版：token 之间从不交互，通道间也不通信)
                           # 实测：weather 96 格 -7.23%(约 8σ，3 种子)；ETTh1 上不显著，但 ETTh1 的跨通道
                           # 可提取信息实测中位 +0.1%（weather +1.5%、11/21 通道正增益），即数据集无信号所致
  token_mix_layers: 1      # token 图混合层数（两个胜出 baseline 均为 2）；每层各带零初始化门
  token_pos_enc: false     # direct 挡给每个 token 拼归一化 (起点,段长) 两维。边界可变时展平头对
                           #   "第 i 槽位"的固定权重会失配（槽位覆盖的时间逐样本漂移），本项补位置信息
  boundary_scope: sample   # batch(原版：SRA 对 batch 维取均值，分块方案由整批投票决定——同一条样本换批次
                           #   同伴分段就变；等分挡边界固定故不显形，自适应挡致命) | sample(逐样本定边界)
  gate_temp_init: 1.0      # MoE 门控可学习逆温度初值（1.0 = 原版等价）。原版无温度、余弦分数值域 [-1,1]
                           # 直接过 softmax，实测门控熵达最大熵 99.7%，混合专家退化为等权平均
  n_tokens: 6              # 固定段数 N（uniform 挡须整除 seq_len；direct 挡预测头输入维 = N·p_model）
  use_backbone: true       # 决定性对照: false = 完全旁路 FRAME 主干（分块+谱MoE 不构造），退化为 RevIN+预测头
  residual_mode: none      # none(原版) | gate_input(主干恒通、x 门控接入) | gate_backbone(x 恒通、主干作零初始化修正)
  moe_init: small          # small(原版 std=0.02，eff_w≈0 使主干清零输入) | allpass(时域冲激，起点为全通恒等滤波)
  head_drop: 0.0           # 预测头 dropout（0 = 原版等价；长视野头部占九成参数，抗过拟合用）
  head_type: linear        # mlp = 原版 Linear(L,d_model)-ReLU-Linear(d_model,H) | linear = 单层 Linear(L,H)（缩头，把容量让回主干）
  aux_stream: trend        # 近端流（原版无；2026-09-10 起为架构默认组件，所有数据集统一开启）：
                           #   none | full(全窗 Linear(L,H)，DLinear 式) | trend(时间轴滑动平均：
                           #   趋势走线性头、季节项进主干，xPatch/DLinear 分解式) | last(最后 L/N 个原始点 Linear(L/N,H))
                           #   与主干并联、零初始化 tanh 门相加：full/last 初值与 none 逐位等价，trend 挡主干输入改为季节项。
                           #   动机：ETTh1 96 格按预测步拆误差，第 1 步落后赢家 24.6%、1–4 步 15.6%、64–96 步仅 1.2%——
                           #   direct 挡下末尾原始值只能经末段谱滤波进头，相位精确的近端信息丢失；96 格两个赢家
                           #   （TimeMosaic/xPatch）都有原始序列→输出的线性通路。能力上限一层线性(≈DLinear)，主干须优于它才拿到权重
                           #   进入架构的依据（只看验证集）：ETTh2 单种子四视野最优验证损失之和 1.4147(trend) vs 1.4696(none)，
                           #   四个视野全部更优；ETTh1 验证集不支持（4.5430 vs 4.5257）但测试支持，故不以 ETTh1 定案。见 docs/training_protocol.md
  aux_kernel: 25           # trend 挡的时间轴滑动平均窗（仅 aux_stream=trend 生效）
  token_mix_gate: shared   # shared(intra 跨时间 + inter 跨通道 两步等权相加) | split(两步各配标量门，初值 1 与 shared 逐位等价)
                           #   ETTh1 跨通道可提取信息≈0、关掉整个 token 混合反好 1.8%，但共用门只能同开同关；
                           #   split 让模型只关跨通道、保留跨时间，训练后门值直接读出该数据集用了哪种关系

# ---- baseline 模型专属节（键名带模型前缀防撞；各模型只读自己的节）----
dlinear:
  dl_individual: false     # 每变量独立线性层；官方默认 False，官方脚本均未开启
  dl_kernel_size: 25       # 分解滑动平均核宽；官方 models/DLinear.py 硬编码 25，此处参数化

xpatch:
  xp_ma_type: ema          # 分解移动平均类型: reg(无分解)/ema/dema（官方 run.py 默认 ema）
  xp_alpha: 0.3            # EMA 平滑系数（官方默认 0.3）
  xp_beta: 0.3             # DEMA 二阶平滑系数，仅 ma_type=dema 时生效（官方默认 0.3）
  xp_revin: true           # RevIN 可逆实例归一化开关（官方 --revin 默认 1）
  xp_padding_patch: end    # patch 末端 ReplicationPad: end/其他值关闭（官方默认 end，脚本从不改）

duet:
  duet_num_experts: 4      # MoE 专家数（官方 seq96 配方 ETT/weather 均 4，仅 ETTm1 覆盖为 6）
  duet_k: 2                # noisy top-k 激活专家数（官方 seq96 脚本 20 格全部 k=2）
  duet_hidden_size: 256    # 路由 encoder 隐层宽度（官方 duet.py 默认 256；仅 ETTm2 覆盖 512）
  duet_fc_dropout: 0.2     # 预测线性头 dropout（官方默认 0.2；ETTh1=0.1/ETTh2=0.5 由 yaml 覆盖）
  duet_noisy_gating: true  # noisy top-k 门控开关（官方默认 true，脚本未覆盖）
  duet_CI: true            # 通道独立模式（官方 seq96 脚本 20 格全部 CI=1）
  duet_moving_avg: 25      # 专家内部 DLinear 分解滑窗（官方默认 25；不复用 prism 的 moving_avg）

simpletm:
  stm_alpha: 1.0            # 几何注意力楔积项权重：(1-α)·内积 + α·楔积范数（官方 --alpha 默认 1）
  stm_l1_weight: 0.00005    # 注意力分数 |scores|.mean() 稀疏正则权重，经 aux_loss 通路生效（0 关闭）
  stm_wv: db1               # 小波母函数，pywt.Wavelet 支持的任意名（官方默认 db1）
  stm_m: 3                  # 平稳小波变换分解级数（官方默认 3）
  stm_geomattn_dropout: 0.5 # 几何注意力 QKV 投影 dropout（官方默认 0.5）
  stm_requires_grad: true   # true = 小波滤波器可学习（官方默认 True）
  stm_kernel_size: null     # 非 null 时用随机初始化滤波器替代 pywt 小波（官方默认 None）

patchmlp:
  pml_decomp_kernel: 13    # embedding 维分解滑窗；官方 model/PatchMLP.py 硬编码 series_decomp(13)
  pml_patch_lens: [48, 24, 12, 6]  # 多尺度 patch 长度（步长恒为各自一半）；官方硬编码，配 seq96 恰好整除

timemixer:
  tmx_down_sampling_layers: 3     # 多尺度下采样层数（官方 argparse 默认 0；unify 配方 20 格全 3）
  tmx_down_sampling_window: 2     # 下采样窗口（官方 argparse 默认 1；unify 配方全 2）
  tmx_down_sampling_method: avg   # 下采样方式 avg/max/conv（官方默认 avg）
  tmx_channel_independence: 1     # 1=通道独立展平为 [B*C,T,1]（官方默认 1）
  tmx_decomp_method: moving_avg   # PDM 分解方式 moving_avg/dft_decomp（官方默认 moving_avg）
  tmx_moving_avg: 25              # 滑动平均分解窗口（官方默认 25；moving_avg 键被 PRISM 占用故前缀化）
  tmx_top_k: 5                    # dft_decomp 保留 top-k 频率（官方默认 5；该分支未 review 勿启用）
  tmx_use_future_temporal_feature: 0  # 1=未来时间特征辅助解码（官方默认 0，unify 配方未启用）

pathformer:
  pf_layer_nums: 3         # AMS pathway 层数（官方默认 3，全部脚本亦为 3）
  pf_num_nodes: 7          # 变量数，须等于 enc_in（官方默认 21；此处取 ETTh1 的 7，各 yaml 显式覆盖）
  pf_k: 2                  # 每层路由选 Top-K 个 patch 尺度专家（官方默认 2）
  pf_num_experts_list: [4, 4, 4]   # 每层专家数（官方默认，脚本从不覆盖；须与每层 patch 数一致）
  pf_patch_size_list: [16, 12, 8, 32, 12, 8, 6, 4, 8, 6, 4, 2]  # 扁平列表，模型内 reshape 成 (layer_nums, -1)
  pf_residual_connection: 0        # AMS 层残差连接开关 0/1（官方默认 0）
  pf_revin: true           # RevIN 归一化（官方默认 1；affine=False, subtract_last=False）
  pf_batch_norm: false     # Transformer_Layer 内 BatchNorm（官方默认 0，全部脚本亦为 0）

timefilter:
  tfil_alpha: 0.1          # KNN 图构建保留比例（官方 --alpha 默认 0.1；moe 损失权重 0.05 硬编码于模型 aux_loss，两者无关）
  tfil_top_p: 0.5          # MoE 动态路由累计概率阈值（官方 --top_p 默认 0.5；0.0 = 关闭 mask MoE 及其正则）
  tfil_pos: true           # patch 嵌入正弦位置编码开关（官方 --pos 默认 1；ETTh1 官方配方置 0）

timemosaic:
  tms_patch_len_list: [8, 16, 32]  # 自适应 patch 候选粒度（官方默认；须 max 整除 seq_len、min 整除 max）
  tms_num_latent_token: 4  # 每段 prompt token 数（官方默认 4）
  tms_channel: CI          # 通道/日历信息注入方式 CI/CD/CDP/CDA/CI+（官方默认 CI，脚本逐格覆盖）
  tms_lambda_cls: 0.001    # 粒度选择比例正则权重（官方 exp 非 AMP 分支 0.001，经 aux_loss 通路生效）
  tms_mask_ratio: 0.0      # 输入重构 mask 比例（官方默认 0；重构分支未移植，>0 时构造报错）
  tms_pre96: 32            # pred_len=96 的分段解码段长（官方默认 32）
  tms_pre192: 64           # pred_len=192 段长（官方默认 64）
  tms_pre336: 168          # pred_len=336 段长（官方默认 168）
  tms_pre720: 240          # pred_len=720 段长（官方默认 240）
  tms_pre12: 6             # 其他 pred_len 的兜底段长（官方默认 6）

system:
  use_gpu: true
  gpu: 0
  checkpoints: ./checkpoints/
  results: ./results/
  save_checkpoint: false   # true 时把最优权重写盘（is_training: 0 的仅测试模式需要）
  save_arrays: false       # true 时把 pred.npy/true.npy 全量预测数组写盘（大数据集单实验可达数 GB）
