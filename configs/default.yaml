# 全局默认配置。实验配置（configs/<Model>/*.yaml）按节深合并覆盖这里的值；
# 命令行可用 --set key=value 覆盖单项（支持 'training.learning_rate=1e-3' 或裸 'pred_len=192'）。
# 合并后所有叶子键被扁平化为单层命名空间，代码里以 configs.d_model 方式访问，
# 因此不同节之间的键名不允许重复。

basic:
  task_name: long_term_forecast
  model: PatchTST          # models/__init__.py 的 MODEL_REGISTRY 键名
  model_id: test           # 实验标识，进入 checkpoint/结果目录名
  seed: 2021
  deterministic: false     # true = 严格复现模式（cudnn.deterministic，稍慢）
  is_training: 1           # 0 = 只加载 checkpoint 测试
  des: exp                 # 实验描述后缀
  itr: 1                   # 重复次数

data:
  data: ETTh1              # data_provider/data_factory.py 的 data_dict 键名
  root_path: ./dataset/
  data_path: ETTh1.csv
  features: M              # M: 多变量预测多变量; S: 单变量; MS: 多变量预测单变量
  target: OT               # features 为 S/MS 时的目标列
  freq: h                  # 时间特征频率: s/t/h/d/b/w/m
  embed: timeF             # timeF: time_features 编码; 其他: 整数日历特征
  seq_len: 96              # 输入窗口长度
  label_len: 48            # decoder 起始 token 长度（PatchTST 不使用）
  pred_len: 96             # 预测长度
  enc_in: 7                # 输入变量数
  dec_in: 7
  c_out: 7
  num_workers: 4
  inverse: false           # 测试时是否反标准化后再算指标

model:
  d_model: 512
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 2048
  factor: 1
  dropout: 0.1
  head_dropout: 0.1        # 预测头独立 dropout（官方 PatchTST 头部为 0，encoder 为 0.2/0.3）
  activation: gelu
  patch_len: 16
  stride: 8
  use_norm: true           # 模型内置归一化开关（iTransformer/SimpleTM 等 baseline 读取；PatchTST/PRISM 不读）

training:
  train_epochs: 30
  batch_size: 32
  patience: 3
  learning_rate: 0.0001
  loss: MSE                # 训练损失：MSE/MAE/huber/smooth_l1/arctan_mae(xPatch)；验证与早停恒用 MSE
  lradj: type1             # type1/type2/type3/cosine/constant/TST(OneCycleLR)/sigmoid(xPatch)/cosine2(TimeFilter)
  pct_start: 0.3           # 仅 lradj=TST 时生效
  use_amp: false
  rec_lambda: 1.0          # 时域 MSE 权重（仅 auxi_lambda>0 时参与加权）
  auxi_lambda: 0.0         # FreDF 频域辅助损失权重；0 = 完全关闭（走原始损失路径）
  auxi_type: complex       # 频域损失形式（当前实现: complex 差的模）

prism:                     # PRISM 专用超参（其他模型不读取本节）
  n_patterns: 8            # K：谱模式字典大小
  freq_topk: 8             # 幅度谱 top-k 稀疏化
  smooth_sigma: 1.0        # 稀疏谱的高斯平滑带宽（0 关闭）
  route_temp_init: 5.0     # 路由门控可学习逆温度的初始值
  route_reg: 0.0           # 门控熵正则权重（经模型 aux loss 钩子生效）
  use_srm: true            # 消融③: false = 完全旁路谱关系建模（异构图+谱滤波）
  use_graph: true          # 消融④: false = 保留逐节点滤波器但无图消息传递
  d_graph: 64              # 图节点特征维度
  graph_layers: 1
  use_fusion: true         # 消融⑤: false = 只用趋势分支预测
  decomp_type: ema         # ema | moving_avg
  decomp_alpha: 0.3        # EMA 平滑系数（decomp_type=ema）
  moving_avg: 25           # 滑动平均窗口（decomp_type=moving_avg）
  d_head: 128              # 预测头瓶颈宽度
  # ---- 谱驱动信息时钟（自适应 patch 主干）----
  clock_n_patch: 12        # patch 预算 N（token 数恒定；须整除 seq_len）
  clock_d_v: 16            # 内容前端 conv 特征维度
  clock_basis: 4           # 箱内余弦基个数 R（保序池化；1 = 纯均值池化消融）
  clock_floor: 0.2         # 密度下界混合系数 λ：单箱物理宽度 ≤ L/(λN)
  clock_reverse: true      # 反向积分锚定（最近时间步获得最强边界梯度）
  clock_win: 16            # 短时谱滑窗宽度
  clock_density: spectral  # 消融②: spectral=局部谱亲和驱动（论文一致）| mlp=自由密度对照
  clock_detach_dict: false # true = 时钟不回传梯度给谱模式字典（保护 SRM 语义）
  clock_temp_init: 5.0     # 局部亲和 softmax 可学习逆温度初始值
  clock_mode: adaptive     # 消融①: adaptive | uniform(严格等分) | reweight_only(边界钉死)
  clock_kl_lo: 0.0         # KL 带下界（逼迫时钟偏离均匀；0 关闭）
  clock_kl_hi: 0.0         # KL 带上界（限制边界漂移；0 关闭）
  clock_reg: 0.0           # KL 带正则权重（经模型 aux loss 钩子生效）

system:
  use_gpu: true
  gpu: 0
  checkpoints: ./checkpoints/
  results: ./results/
  save_checkpoint: false   # true 时把最优权重写盘（is_training: 0 的仅测试模式需要）
  save_arrays: false       # true 时把 pred.npy/true.npy 全量预测数组写盘（大数据集单实验可达数 GB）
