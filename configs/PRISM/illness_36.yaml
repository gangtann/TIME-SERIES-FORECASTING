# PRISM(FRAME 主干) / illness / 36 -> 36（官方 scripts/Frame/illness.sh：d_model=512 pattern_nums=3 seasonal_alpha=0.7 p_model=64 freq_topk=5
# rec_lambda=0.7 auxi_lambda=0.3 batch=256 lr=0.005 epochs=10 patience=3 min_patch_len=8 pattern_strategy=1；
# 官方脚本四个 pred_len 同配方；seed/切分/标准化/指标/drop_last=False 用本框架协议）
# n_tokens 取 4 而非默认 6：seq_len=36 时 6 段的 token_len=6 只有 4 个频点，装不下官方 freq_topk=5
# （models/PRISM.py 构造期断言 freq_topk <= token_len//2+1）；4 段 token_len=9 有 5 个频点，恰好够。
basic:
  model: PRISM
  model_id: PRISM_illness_36_36

data:
  data: custom
  data_path: national_illness.csv
  seq_len: 36
  label_len: 18
  pred_len: 36
  enc_in: 7
  dec_in: 7
  c_out: 7

model:
  d_model: 512

prism:
  pattern_nums: 3
  seasonal_alpha: 0.7
  p_model: 64
  freq_topk: 5
  patch_pool: [0, 4, 6, 8]
  n_tokens: 4

training:
  batch_size: 256
  learning_rate: 0.005
  patience: 5              # 主线配方：不设轮数上限（default 100）、type3 学习率、耐心 5；原版 Frame 为 10 轮/type1/耐心 3
  lradj: type3
  rec_lambda: 0.7
  auxi_lambda: 0.3
