# PRISM(FRAME 主干) / exchange / 96 -> 336（官方 scripts/Frame/Exchange.sh：d_model=512 pattern_nums=7 seasonal_alpha=0.9 p_model=64 freq_topk=7
# rec_lambda=1.0 auxi_lambda=0.0 batch=256 lr=0.005 epochs=10 patience=3 min_patch_len=8 pattern_strategy=1；
# 官方脚本四个 pred_len 同配方；seed/切分/标准化/指标/drop_last=False 用本框架协议）
basic:
  model: PRISM
  model_id: PRISM_exchange_96_336

data:
  data: custom
  data_path: exchange_rate.csv
  pred_len: 336
  enc_in: 8
  dec_in: 8
  c_out: 8

model:
  d_model: 512

prism:
  pattern_nums: 7
  seasonal_alpha: 0.9
  p_model: 64
  freq_topk: 7

training:
  batch_size: 256
  learning_rate: 0.005
  patience: 5              # 主线配方：不设轮数上限（default 100）、type3 学习率、耐心 5；原版 Frame 为 10 轮/type1/耐心 3
  lradj: type3
  rec_lambda: 1.0
  auxi_lambda: 0.0
