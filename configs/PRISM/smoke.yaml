# PRISM 本地冒烟配置（CPU 可跑，1 epoch，小 d_model）
basic:
  model: PRISM
  model_id: smoke_prism

data:
  data: ETTh1
  data_path: ETTh1.csv
  pred_len: 96
  num_workers: 0

model:
  d_model: 128

training:
  train_epochs: 1
  batch_size: 32
  learning_rate: 0.005
  patience: 3
  rec_lambda: 0.7
  auxi_lambda: 0.3

system:
  use_gpu: false
