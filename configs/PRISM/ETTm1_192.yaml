# PRISM(FRAME 主干) / ETTm1 / 96 -> 192（官方 scripts/Frame/ETTm1.sh：d_model=512 pattern_nums=21
# seasonal_alpha=1.0 p_model=64 freq_topk=3 rec_lambda=0.3 auxi_lambda=0.7
# batch=256 lr=0.005 epochs=10 patience=3 min_patch_len=8 pattern_strategy=1 lradj=type1(官方未覆盖)；
# 官方脚本仅保留 pred_len=336 一档调参，96/192/720 沿用同数据集 336 配方；
# seed/切分/标准化/指标/drop_last=False 用本框架协议，官方 seed 为 2024）
basic:
  model: PRISM
  model_id: PRISM_ETTm1_96_192

data:
  data: ETTm1
  data_path: ETTm1.csv
  pred_len: 192

model:
  d_model: 512

prism:
  pattern_nums: 21
  seasonal_alpha: 1.0
  p_model: 64
  freq_topk: 3

training:
  batch_size: 256
  learning_rate: 0.005
  patience: 5              # 主线配方：不设轮数上限（default 100）、type3 学习率、耐心 5；原版 Frame 为 10 轮/type1/耐心 3
  lradj: type3
  rec_lambda: 0.3
  auxi_lambda: 0.7
