# xPatch / ETTh2 / 96 -> 336（官方 scripts/xPatch_unified.sh L40-58：batch=2048 lr=0.0005 lradj=sigmoid + ema/0.3/0.3；
# epochs=100/patience=10/patch=16/8/padding=end/revin 取官方 run.py argparse 默认；训练损失=官方 exp_main 的 arctan 加权 MAE；
# test 的 drop_last 本框架恒 False，对应官方论文 fair 版协议）
basic:
  model: xPatch
  model_id: xPatch_ETTh2_96_336

data:
  data: ETTh2
  data_path: ETTh2.csv
  pred_len: 336

training:
  batch_size: 2048
  learning_rate: 0.0005
  lradj: sigmoid
  loss: arctan_mae
  train_epochs: 100
  patience: 10
