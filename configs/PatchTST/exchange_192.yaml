# PatchTST / Exchange / 96 -> 192（超参对齐官方仓库 yuqinie98/PatchTST；seq_len 用本框架协议）
# 官方仓库无 exchange 脚本（论文未测），借用 ETTh 官方配方
basic:
  model_id: exchange_96_192

data:
  data: custom
  data_path: exchange_rate.csv
  pred_len: 192
  enc_in: 8
  dec_in: 8
  c_out: 8

model:
  d_model: 16
  d_ff: 128
  e_layers: 3
  n_heads: 4
  dropout: 0.3
  head_dropout: 0.0
  factor: 3

training:
  batch_size: 128
  lradj: type3
  patience: 10             # 官方 100（= 固定跑满全部轮数）；2026-09-10 用户规定按早停自然收敛，取官方其他脚本常用的 10
