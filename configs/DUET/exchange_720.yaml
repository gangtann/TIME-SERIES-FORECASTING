# DUET / exchange / 96 -> 720（官方 decisionintelligence/DUET scripts/multivariate_forecast/DUET_unified_seq_len_96.sh L53；batch 32 与 default 相同不覆盖）
# 注：官方另有 Exchange_script/DUET.sh 同为 seq_len 96 但逐视野不同配方（batch 128 等）；按既有 DUET 配置惯例统一取 unified 脚本
basic:
  model: DUET
  model_id: DUET_exchange_96_720

data:
  data: custom
  data_path: exchange_rate.csv
  pred_len: 720
  enc_in: 8
  dec_in: 8
  c_out: 8

model:
  d_model: 2048
  d_ff: 2048
  e_layers: 1
  n_heads: 1
  factor: 3
  dropout: 0.2

training:
  train_epochs: 100
  patience: 5
  learning_rate: 0.00005
  loss: MAE
  lradj: type3

duet:
  duet_num_experts: 5
  duet_k: 3
  duet_hidden_size: 128
  duet_fc_dropout: 0.0  # 官方脚本 fc_dropout 0（default 0.2）
