# PathFormer / electricity / 96 -> 720（官方配方 decisionintelligence/pathformer scripts/multivariate/electricity.sh（四个 pred 同配方）；损失 nn.L1Loss -> MAE）
# 官方脚本本身即 seq_len=96，与本框架协议一致；train_epochs/patience 照官方（OneCycleLR 计划按轮数定义）
# 显存提示：321 通道 × batch 16，AMS 专家逐 patch 循环（第 3 层含 patch 2 = 48 次 intra 注意力），24 GB 卡有 OOM 风险；
# 按规定保持官方 batch 16、不设 micro_batch，若 OOM 需另行决定
basic:
  model: PathFormer
  model_id: PathFormer_electricity_96_720

data:
  data: custom
  data_path: electricity.csv
  pred_len: 720
  enc_in: 321
  dec_in: 321
  c_out: 321

model:
  d_model: 16
  d_ff: 128

pathformer:
  pf_num_nodes: 321
  pf_k: 2
  pf_patch_size_list: [16, 12, 8, 32, 12, 8, 6, 4, 8, 6, 4, 2]
  pf_residual_connection: 1

training:
  train_epochs: 50
  batch_size: 16
  patience: 10
  learning_rate: 0.001
  loss: MAE
  lradj: TST
  pct_start: 0.2
