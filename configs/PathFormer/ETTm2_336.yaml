# PathFormer / ETTm2 / 96 -> 336（官方配方 scripts/multivariate/ETTm2.sh（四个 pred 同配方；residual 未传，取 run.py 默认 0）；损失 nn.L1Loss -> MAE）
basic:
  model: PathFormer
  model_id: PathFormer_ETTm2_96_336

data:
  data: ETTm2
  data_path: ETTm2.csv
  pred_len: 336

model:
  d_model: 16
  d_ff: 64

pathformer:
  pf_num_nodes: 7
  pf_k: 2
  pf_patch_size_list: [16, 12, 8, 32, 12, 8, 6, 32, 8, 6, 16, 12]
  pf_residual_connection: 0

training:
  train_epochs: 30
  batch_size: 512
  patience: 10
  learning_rate: 0.001
  loss: MAE
  lradj: TST
  pct_start: 0.4
