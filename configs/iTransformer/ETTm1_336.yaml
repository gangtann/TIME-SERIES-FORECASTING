# iTransformer / ETTm1 / 96 -> 336（官方 scripts/multivariate_forecasting/ETT/iTransformer_ETTm1.sh；脚本未写的训练超参 = 官方 run.py argparse 默认）
# freq 按本框架数据协议取 t（官方脚本用 run.py 默认 h，协变量 token 数 5 vs 4）
basic:
  model: iTransformer
  model_id: iTransformer_ETTm1_96_336

data:
  data: ETTm1
  data_path: ETTm1.csv
  freq: t
  pred_len: 336

model:
  d_model: 128
  d_ff: 128
  e_layers: 2

training:
  train_epochs: 100        # 官方轮数不再覆盖（学习率计划与轮数无关）：靠早停自然收敛，100 只是安全上限
  # train_epochs 不再覆盖（官方 10）：学习率计划与轮数无关，上限取 default 的 100、靠早停自然收敛
