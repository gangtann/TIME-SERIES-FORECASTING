# iTransformer / ETTh2 / 96 -> 336（官方 scripts/multivariate_forecasting/ETT/iTransformer_ETTh2.sh；脚本未写的训练超参 = 官方 run.py argparse 默认）
basic:
  model: iTransformer
  model_id: iTransformer_ETTh2_96_336

data:
  data: ETTh2
