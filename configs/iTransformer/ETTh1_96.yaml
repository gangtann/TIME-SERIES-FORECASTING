# iTransformer / ETTh1 / 96 -> 96（官方 scripts/multivariate_forecasting/ETT/iTransformer_ETTh1.sh；脚本未写的训练超参 = 官方 run.py argparse 默认）
basic:
  model: iTransformer
  model_id: iTransformer_ETTh1_96_96

data:
  data: ETTh1
  data_path: ETTh1.csv
  pred_len: 96

model:
  d_model: 256
  d_ff: 256
  e_layers: 2

training:
  train_epochs: 100        # 官方轮数不再覆盖（学习率计划与轮数无关）：靠早停自然收敛，100 只是安全上限
  # train_epochs 不再覆盖（官方 10）：学习率计划与轮数无关，上限取 default 的 100、靠早停自然收敛
