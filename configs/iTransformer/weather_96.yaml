# iTransformer / weather / 96 -> 96（官方 scripts/multivariate_forecasting/Weather/iTransformer.sh；脚本未写的训练超参 = 官方 run.py argparse 默认）
basic:
  model: iTransformer
  model_id: iTransformer_weather_96_96

data:
  data: custom
  data_path: weather.csv
  pred_len: 96
  enc_in: 21
  dec_in: 21
  c_out: 21

model:
  d_model: 512
  d_ff: 512
  e_layers: 3

training:
  train_epochs: 100        # 官方轮数不再覆盖（学习率计划与轮数无关）：靠早停自然收敛，100 只是安全上限
  # train_epochs 不再覆盖（官方 10）：学习率计划与轮数无关，上限取 default 的 100、靠早停自然收敛
