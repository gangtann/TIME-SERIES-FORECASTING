# TimeMixer / weather / 96 -> 192（官方配方 scripts/long_term_forecast/Weather_script/TimeMixer_unify.sh；
# 脚本未写键取官方 run.py argparse 默认：lradj=TST、pct_start=0.2、dropout=0.1、label_len=0）
basic:
  model: TimeMixer
  model_id: TimeMixer_weather_96_192

data:
  data: custom
  data_path: weather.csv
  label_len: 0
