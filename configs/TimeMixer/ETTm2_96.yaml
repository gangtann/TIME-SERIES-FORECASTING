# TimeMixer / ETTm2 / 96 -> 96（官方配方 scripts/long_term_forecast/ETT_script/TimeMixer_ETTm2_unify.sh；
# 脚本未写键取官方 run.py argparse 默认：lradj=TST、pct_start=0.2、dropout=0.1、label_len=0）
# d_model=32 为该脚本特有；epochs/patience 官方脚本未传，取官方 run.py 默认 100/15
basic:
  model: TimeMixer
  model_id: TimeMixer_ETTm2_96_96

data:
  data: ETTm2
  data_path: ETTm2.csv
  label_len: 0
  pred_len: 96
  freq: t

model:
  d_model: 32
  d_ff: 32
  e_layers: 2

training:
  batch_size: 128
  learning_rate: 0.01
  lradj: TST
  pct_start: 0.2
  train_epochs: 100
  patience: 15
