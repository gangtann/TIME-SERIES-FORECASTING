# TimeMixer / electricity / 96 -> 192（官方配方 kwuking/TimeMixer scripts/long_term_forecast/ECL_script/TimeMixer_unify.sh；
# 官方脚本本身即 seq_len=96、label_len=0，结构/训练参数照官方；train_epochs=20 / patience=10 为脚本显式值，保留（TST 即 OneCycleLR 按总轮数排计划）；
# 脚本未写键取官方 run.py argparse 默认：lradj=TST、pct_start=0.2、dropout=0.1；下采样 3 层/窗口 2/avg 与 default.yaml timemixer 节一致，不覆盖；
# 官方 --factor 3 / --d_layers 1 为 TimeMixer 不读的键，不写）
# 显存提示：通道独立展平后每批 32×321=10272 条序列，官方 batch 32 照搬、未设 micro_batch；24 GB 单卡上长视野（720）风险最高
basic:
  model: TimeMixer
  model_id: TimeMixer_electricity_96_192

data:
  data: custom
  data_path: electricity.csv
  label_len: 0
  pred_len: 192
  enc_in: 321
  dec_in: 321
  c_out: 321

model:
  d_model: 16
  d_ff: 32
  e_layers: 3

training:
  batch_size: 32
  learning_rate: 0.01
  lradj: TST
  pct_start: 0.2
  train_epochs: 20
  patience: 10
