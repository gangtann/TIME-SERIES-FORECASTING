# TimeFilter / traffic / 96 -> 192（官方配方: TROUBADOUR000/TimeFilter scripts/Traffic.sh seq_len=96 段（四视野同一配方）；lradj=cosine2 为官方 cosine 公式 lr/2*(1+cos)，需 utils/tools.py 支持）
# 官方脚本即 seq_len=96，与本框架统一协议一致；脚本未写的超参取官方 run.py argparse 默认：n_heads 4（default.yaml 为 8，显式覆盖）、
# patience 3 / alpha 0.1（与 default.yaml 相同，不覆盖）；factor 3 / d_layers 1 / label_len 48 模型不读或与默认相同，不写
# 注意 patch_len 96 = seq_len：每通道只有 1 个 patch，时间区掩码为空，图退化为 862 通道间的纯空间图；top_p 0.0 关闭 mask MoE 及其正则
# 官方 TROUBADOUR000/TimeFilter utils/tools.py 的 EarlyStopping.__call__ 判停逻辑整段被注释（每轮只存盘，跑满 train_epochs、测试用最后一轮权重）；
# 本框架用真实早停（patience 3 = 官方默认，取最优验证轮）；train_epochs 保留官方 30（cosine 计划按总轮数定义）
# 显存提示：图节点 L = 862×96/96 = 862，每层邻接类张量 [B,H,L,L] = 16×4×862² ≈ 4.8e7 元素（fp32 约 190 MB/个），
# 3 层、top_p 0 省去 MoE 掩码张量，估计 5~8 GB，24 GB 单卡预计可装下；官方 batch 16 照用，不设 micro_batch
basic:
  model: TimeFilter
  model_id: TimeFilter_traffic_96_192

data:
  data: custom
  data_path: traffic.csv
  pred_len: 192
  enc_in: 862
  dec_in: 862
  c_out: 862

model:
  d_model: 512
  d_ff: 2048
  e_layers: 3
  n_heads: 4        # 官方 run.py 默认 4，脚本未写
  dropout: 0.3
  patch_len: 96

timefilter:
  tfil_top_p: 0.0
  tfil_pos: false

training:
  batch_size: 16
  learning_rate: 0.001
  train_epochs: 30
  lradj: cosine2
