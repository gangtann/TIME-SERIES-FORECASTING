# TimeFilter / ETTh2 / 96 -> 720（官方 scripts/ETTh2.sh pred_len=720 段；lradj=cosine2 为官方 cosine 公式 lr/2*(1+cos)，需 utils/tools.py 支持）
basic:
  model: TimeFilter
  model_id: TimeFilter_ETTh2_96_720

data:
  data: ETTh2
  data_path: ETTh2.csv
  pred_len: 720

model:
  d_model: 256
  d_ff: 256
  e_layers: 2
  n_heads: 4
  dropout: 0.3
  patch_len: 8

timefilter:
  tfil_alpha: 0.9
  tfil_top_p: 0.0

training:
  train_epochs: 10
  lradj: cosine2
