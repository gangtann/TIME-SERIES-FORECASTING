# TimeFilter / ETTh2 / 96 -> 96（官方 scripts/ETTh2.sh pred_len=96 段；lradj=cosine2 为官方 cosine 公式 lr/2*(1+cos)，需 utils/tools.py 支持）
basic:
  model: TimeFilter
  model_id: TimeFilter_ETTh2_96_96

data:
  data: ETTh2
  data_path: ETTh2.csv
  pred_len: 96

model:
  d_model: 128
  d_ff: 256
  e_layers: 1
  n_heads: 4
  dropout: 0.8
  patch_len: 4

timefilter:
  tfil_top_p: 0.0

training:
  train_epochs: 10
  lradj: cosine2
