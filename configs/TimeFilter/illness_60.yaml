# TimeFilter / illness / 36 -> 60（无官方配方：TimeFilter 官方仓库 TROUBADOUR000/TimeFilter scripts/ 无 ILI 脚本；
# decisionintelligence/DUET scripts/multivariate_forecast/ILI_script/ 亦无 TimeFilter.sh（DUET 只收录了模型代码）；BenchCouncil/TimeMosaic scripts/TimeFilter/ 同样无 ILI）
# 借用 TimeFilter 自家 scripts/ETTh1.sh 的 pred_len=720 条目（视野按序号映射 24/36/48/60 -> 96/192/336/720）。选 ETTh1 的理由：
#   TimeFilter 自家数据集里 ETTh1/ETTh2 与 ILI 同为 7 通道、样本最少；ETTh1 配方四视野几乎不变（patch_len 2、dropout 0.8、无位置编码），
#   强正则适合 ILI 仅约 600 条训练样本；且 patch_len 2 整除 36（ETTh2 在 336/720 用 patch_len 8，不整除 36）
# 形状检查：models/TimeFilter.py 断言 seq_len % patch_len == 0；36/2 = 18 patch/通道，图节点 7×18 = 126，KNN k = int(0.1×126) = 12，无需任何改动
# 输入窗口按本框架 illness 协议 seq_len=36、label_len=18（TimeFilter 不读 label_len）；未写键取官方 run.py 默认 batch 32 / lr 1e-4 / patience 3（与 default.yaml 同）
# 官方 TROUBADOUR000/TimeFilter utils/tools.py 的 EarlyStopping.__call__ 判停逻辑整段被注释（每轮只存盘，跑满 train_epochs、测试用最后一轮权重）；
# 本框架用真实早停（patience 3 = 官方默认，取最优验证轮）；train_epochs 保留官方 10（cosine 计划按总轮数定义）
basic:
  model: TimeFilter
  model_id: TimeFilter_illness_36_60

data:
  data: custom
  data_path: national_illness.csv
  seq_len: 36
  label_len: 18
  pred_len: 60

model:
  d_model: 128
  d_ff: 128
  e_layers: 2
  n_heads: 4
  dropout: 0.8
  patch_len: 2

timefilter:
  tfil_pos: false

training:
  train_epochs: 10
  lradj: cosine2
