# TimeFilter / ETTm2 / 96 -> 96（官方 scripts/ETTm2.sh pred_len=96 段；lradj=cosine2 为官方 cosine 公式 lr/2*(1+cos)，需 utils/tools.py 支持）
basic:
  model: TimeFilter
  model_id: TimeFilter_ETTm2_96_96

data:
  data: ETTm2
  data_path: ETTm2.csv
  pred_len: 96

model:
  d_model: 128
  d_ff: 128
  e_layers: 2
  n_heads: 4
  dropout: 0.6
  patch_len: 16

timefilter:
  tfil_top_p: 0.0

training:
  train_epochs: 10
  lradj: cosine2
