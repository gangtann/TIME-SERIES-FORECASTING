# TimeFilter / electricity / 96 -> 720（官方配方: TROUBADOUR000/TimeFilter scripts/ECL.sh seq_len=96 的 pred_len=192/336/720 段；lradj=cosine2 为官方 cosine 公式 lr/2*(1+cos)，需 utils/tools.py 支持）
# 官方脚本即 seq_len=96，与本框架统一协议一致；脚本未写的超参取官方 run.py argparse 默认：n_heads 4（default.yaml 为 8，显式覆盖）、
# patience 3 / alpha 0.1 / top_p 0.5 / pos 1（与 default.yaml 相同，不覆盖）；factor 3 / d_layers 1 / label_len 48 模型不读或与默认相同，不写
# 官方 TROUBADOUR000/TimeFilter utils/tools.py 的 EarlyStopping.__call__ 判停逻辑整段被注释（每轮只存盘，跑满 train_epochs、测试用最后一轮权重）；
# 本框架用真实早停（patience 3 = 官方默认，取最优验证轮）；train_epochs 保留官方 15（cosine 计划按总轮数定义）
# 显存提示：图节点 L = 321×96/32 = 963，每层邻接类张量 [B,H,L,L] = 16×4×963² ≈ 5.9e7 元素（fp32 约 237 MB/个），
# 每层反传约保存 10 份、共 2 层，估计 5~8 GB，24 GB 单卡预计可装下；官方 batch 16 照用，不设 micro_batch
basic:
  model: TimeFilter
  model_id: TimeFilter_electricity_96_720

data:
  data: custom
  data_path: electricity.csv
  pred_len: 720
  enc_in: 321
  dec_in: 321
  c_out: 321

model:
  d_model: 512
  d_ff: 512
  e_layers: 2
  n_heads: 4        # 官方 run.py 默认 4，脚本未写
  dropout: 0.4
  patch_len: 32

training:
  batch_size: 16
  learning_rate: 0.001
  train_epochs: 15
  lradj: cosine2
