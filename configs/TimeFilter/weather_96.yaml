# TimeFilter / weather / 96 -> 96（官方 scripts/Weather.sh pred_len=96 段；lradj=cosine2 为官方 cosine 公式 lr/2*(1+cos)，需 utils/tools.py 支持）
basic:
  model: TimeFilter
  model_id: TimeFilter_weather_96_96

data:
  data: custom
  data_path: weather.csv
  pred_len: 96
  enc_in: 21
  dec_in: 21
  c_out: 21

model:
  d_model: 128
  d_ff: 256
  e_layers: 2
  n_heads: 4
  dropout: 0.3
  patch_len: 48

training:
  train_epochs: 10
  lradj: cosine2
  learning_rate: 0.0005
